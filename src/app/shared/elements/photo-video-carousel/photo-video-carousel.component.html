<div class="relative w-full mx-auto">
  <!-- Slides -->
  <div class="relative aspect-[1/1] md:aspect-[16/9] overflow-hidden">
    @for (item of items; track trackByIndex(i, item); let i = $index) {
      <div
        [hidden]="i !== currentIndex"
        class="w-full h-full"
        >
        <!-- Image -->
        @if (item.type === 'photo') {
          <div
            class="relative w-full h-full"
            [class.cursor-zoom-in]="enableLightbox"
            (click)="openLightbox()"
            >
            <!-- Blurred Background Image -->
            <div class="absolute inset-0 z-0" style="pointer-events: none">
              <img
                [ngSrc]="item.photo.src"
                [width]="item.photo.width"
                [height]="item.photo.height"
                alt="Blurred background"
                class="w-full h-full object-cover blur-md brightness-50"
                />
              </div>
              <!-- Foreground Image -->
              <div
                class="absolute inset-0 z-10 flex items-center justify-center"
                style="pointer-events: none"
                >
                <img
                  [ngSrc]="item.photo.src"
                  [width]="item.photo.width"
                  [height]="item.photo.height"
                  alt="Project screenshot"
                  class="max-w-full max-h-full object-contain"
                  />
                </div>
              </div>
            }
            <!-- YouTube Video -->
            @if (item.type === 'video') {
              <iframe
                [src]="item.video"
                title="Project demo video"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                class="w-full h-full"
              ></iframe>
            }
          </div>
        }

        <!--
          Expand affordance. Also the keyboard entry point, and the only way in
          for video slides, since the iframe swallows clicks itself.
        -->
        @if (enableLightbox && items.length > 0) {
          <button
            (click)="openLightbox()"
            aria-label="View media full screen"
            class="absolute top-2 right-2 bg-white/50 backdrop-blur-sm p-2 border border-secondary-grey z-20 w-8 h-8 flex items-center justify-center"
            >
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"
                />
            </svg>
          </button>
        }
      </div>

      <!-- Navigation Arrows (Optional) -->
      <button
        (click)="prev()"
        aria-label="Previous image"
        class="absolute top-1/2 left-2 transform -translate-y-1/2 bg-white/50 backdrop-blur-sm p-2 border border-secondary-grey z-20 w-8 h-8 flex items-center justify-center"
        >
        <!-- < svg-->
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 19l-7-7 7-7"
            />
          </svg>
        </button>
        <button
          (click)="next()"
          aria-label="Next image"
          class="absolute top-1/2 right-2 transform -translate-y-1/2 bg-white/50 backdrop-blur-sm p-2 border border-secondary-grey z-20 w-8 h-8 flex items-center justify-center"
          >
          <!-- > svg-->
          <svg
            class="w-4 h-4 rotate-180"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
              />
            </svg>
          </button>

          <!-- Dots Indicator -->
          <div class="flex justify-center items-center gap-[3px] mt-2 z-20">
            @for (_ of items; track trackByIndex(i, _); let i = $index) {
              <button
                (click)="goToSlide(i)"
                [attr.aria-label]="'Go to slide ' + (i + 1)"
                class="h-2 bg-secondary-dark-grey/50 transition-all ease-in-out duration-300 rounded"
      [ngClass]="{
        'w-2': i !== currentIndex,
        'w-10': i === currentIndex
      }"
              ></button>
            }
          </div>
        </div>

<!-- Full-screen viewer -->
@if (enableLightbox && lightboxOpen) {
  <app-media-lightbox
    [items]="items"
    [index]="currentIndex"
    (indexChange)="goToSlide($event)"
    (closed)="closeLightbox()"
  ></app-media-lightbox>
}
